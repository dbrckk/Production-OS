name: P17 signed checkpoint patch

on:
  push:
    branches: [feat/rekor-signed-checkpoint-verification]
    paths: [.github/workflows/p17-signed-checkpoint-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rekor-signed-checkpoint-verification
      - name: Add signed checkpoint verifier
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/production_os/transparency_receipts.py")
          text = path.read_text()
          text = text.replace(
              "from cryptography.hazmat.primitives.asymmetric import ec, ed25519, padding, rsa",
              "from cryptography.hazmat.primitives.asymmetric import ec, ed25519, padding, rsa, utils",
              1,
          )
          marker = "def parse_rekor_v1_receipt("
          if "def verify_rekor_signed_checkpoint(" not in text:
              function = '''def verify_rekor_signed_checkpoint(
              checkpoint: str,
              *,
              public_key_pem: str,
              expected_tree_size: int,
              expected_root_hash: str,
          ) -> bool:
              """Verify a Rekor v1 signed tree checkpoint and bind it to a proof."""
              try:
                  if not isinstance(checkpoint, str) or not checkpoint:
                      return False
                  split = checkpoint.rfind("\\n\\n")
                  if split < 0:
                      return False
                  note = checkpoint[: split + 1]
                  signature_block = checkpoint[split + 2 :]
                  if not signature_block or not signature_block.endswith("\\n"):
                      return False

                  lines = note.splitlines()
                  if len(lines) < 3 or not lines[0]:
                      return False
                  tree_size = int(lines[1])
                  if tree_size != int(expected_tree_size):
                      return False
                  expected_root = str(expected_root_hash).lower()
                  if not _HEX_64.fullmatch(expected_root):
                      return False
                  root = base64.b64decode(lines[2], validate=True)
                  if len(root) != 32 or root.hex() != expected_root:
                      return False

                  public_key = serialization.load_pem_public_key(
                      public_key_pem.encode("ascii")
                  )
                  der = public_key.public_bytes(
                      serialization.Encoding.DER,
                      serialization.PublicFormat.SubjectPublicKeyInfo,
                  )
                  key_hint = hashlib.sha256(der).digest()[:4]
                  note_bytes = note.encode("utf-8")
                  digest = hashlib.sha256(note_bytes).digest()
                  signature_lines = signature_block.splitlines()
                  if not signature_lines:
                      return False

                  for signature_line in signature_lines:
                      parts = signature_line.split(" ", 2)
                      if len(parts) != 3 or parts[0] != "—" or not parts[1]:
                          return False
                      encoded = base64.b64decode(parts[2], validate=True)
                      if len(encoded) < 5 or encoded[:4] != key_hint:
                          return False
                      signature = encoded[4:]
                      if isinstance(public_key, ec.EllipticCurvePublicKey):
                          public_key.verify(
                              signature,
                              digest,
                              ec.ECDSA(utils.Prehashed(hashes.SHA256())),
                          )
                      elif isinstance(public_key, rsa.RSAPublicKey):
                          public_key.verify(
                              signature,
                              digest,
                              padding.PKCS1v15(),
                              utils.Prehashed(hashes.SHA256()),
                          )
                      elif isinstance(public_key, ed25519.Ed25519PublicKey):
                          public_key.verify(signature, note_bytes)
                      else:
                          return False
                  return True
              except (
                  InvalidSignature,
                  TypeError,
                  ValueError,
                  UnicodeEncodeError,
              ):
                  return False
          '''
              if marker not in text:
                  raise SystemExit("parse marker not found")
              text = text.replace(marker, function + "\n\n" + marker, 1)
          path.write_text(text)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify targeted test
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q tests/test_rekor_signed_checkpoint.py
      - name: Commit verifier and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/p17-signed-checkpoint-patch.yml
          git add src/production_os/transparency_receipts.py .github/workflows/p17-signed-checkpoint-patch.yml
          git commit -m "feat(transparency): verify Rekor signed checkpoints"
          git push
