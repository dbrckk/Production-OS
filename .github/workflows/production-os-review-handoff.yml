name: Trusted Production-OS PR Handoff

# Runs from the default branch only. Never checks out or executes Studio code.
on:
  repository_dispatch:
    types: [production_os_review_handoff]

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: production-os-review-handoff
  cancel-in-progress: false

jobs:
  create-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REVIEW_TOKEN: ${{ github.token }}
    steps:
      - name: Verify published checkpoint and open a review PR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import ast
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "dbrckk/Production-OS":
              raise SystemExit("Review handoff must run in the trusted repository")
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          payload = event.get("client_payload")
          if not isinstance(payload, dict) or set(payload) != {"branch", "commit_sha"}:
              raise SystemExit("Invalid Production-OS review handoff payload")
          branch = payload.get("branch")
          sha = payload.get("commit_sha")
          if not isinstance(branch, str) or not re.fullmatch(r"studio/mp-[a-f0-9]{24}", branch):
              raise SystemExit("Handoff branch does not match managed Studio namespace")
          if not isinstance(sha, str) or not re.fullmatch(r"[a-f0-9]{40}", sha):
              raise SystemExit("Handoff commit SHA is invalid")

          token = os.environ["REVIEW_TOKEN"]
          base = "https://api.github.com/repos/" + repo
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "production-os-review-handoff",
          }

          def request(method, path, data=None):
              body = json.dumps(data).encode("utf-8") if data is not None else None
              action = urllib.request.Request(
                  base + path, data=body, method=method, headers={
                      **headers, **({"Content-Type": "application/json"} if body else {}),
                  }
              )
              try:
                  with urllib.request.urlopen(action, timeout=20) as response:
                      raw = response.read(1000000)
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  # Never collapse a forbidden ref lookup or compare into an
                  # unproven claim that only PR creation is disabled.
                  if path.startswith("/git/ref/heads/"):
                      operation = "exact candidate branch lookup"
                  elif path.startswith("/compare/"):
                      operation = "reviewed source diff comparison"
                  elif path.startswith("/contents/"):
                      operation = "current source blob lookup"
                  elif path.startswith("/pulls?"):
                      operation = "existing draft PR lookup"
                  elif path == "/pulls":
                      operation = "draft PR creation"
                  elif path.startswith("/actions/workflows/"):
                      operation = "immutable qualification dispatch"
                  else:
                      operation = "review preflight"
                  if exc.code in {401, 403} and method == "POST" and path == "/pulls":
                      raise SystemExit(
                          "GitHub rejected trusted draft PR creation (HTTP "
                          + str(exc.code) + "). Check Actions workflow "
                          "Pull requests:write and repository Actions > "
                          "General > Allow GitHub Actions to create and "
                          "approve pull requests. Source CI was requested "
                          "independently before PR creation."
                      ) from None
                  raise SystemExit(
                      "Trusted review handoff " + operation + " failed ("
                      + method + " HTTP " + str(exc.code) +
                      "); check the relevant token permissions or repository policy"
                  ) from None

          ref = request("GET", "/git/ref/heads/" + branch)
          verified = (ref.get("object") or {}).get("sha")
          if verified != sha:
              raise SystemExit("Review handoff rejected a stale or unverified branch tip")
          delta = request("GET", "/compare/main..." + sha)
          files = delta.get("files")
          if (delta.get("status") not in {"ahead", "diverged"}
                  or not isinstance(files, list) or not 0 < len(files) < 300):
              raise SystemExit("Review handoff requires a bounded nonempty compare")
          approved_paths = {"src/production_os/worktree_contract.py", "src/production_os/github_work_state.py"}
          if len(files) != 1 or files[0].get("filename") not in approved_paths or files[0].get("status") != "modified":
              raise SystemExit("Review handoff only accepts the vetted one-file worktree source fix")

          # A single named file is not sufficient: another generic engine
          # previously overwrote the same reserved branch with an EMPTY
          # validator (98 lines deleted). Require the exact operator-reviewed
          # one-line repair, and reject omissions, chmod-only changes, extra
          # edits, unverified patch evidence and unexpected AI output.
          changed = files[0]
          patch = changed.get("patch")
          if (type(changed.get("additions")) is not int
                  or type(changed.get("deletions")) is not int
                  or changed["additions"] != 1 or changed["deletions"] != 1
                  or type(changed.get("changes")) is not int
                  or changed["changes"] != 2
                  or not isinstance(patch, str) or len(patch) > 4000):
              raise SystemExit("Review handoff rejected an unbounded source diff")
          source_edits = [
              line for line in patch.splitlines()
              if line.startswith(("+", "-"))
              and not line.startswith(("+++", "---"))
          ]
          expected_edits = [
              '-    text = re.sub(r"-+", "-", text).strip("-.").lower()',
              '+    text = re.sub(r"-+", "-", text).strip("-.").lower().replace(".", "-")',
          ]
          if changed["filename"] == "src/production_os/github_work_state.py":
              expected_edits = [
                  '-    states = [str(r.get("state", "")).upper() for r in reviews]',
                  '+    states = list({(r.get("user") or {}).get("id") or id(r): str(r.get("state", "")).upper() for r in reviews if str(r.get("state", "")).upper() in {"APPROVED", "CHANGES_REQUESTED", "DISMISSED"}}.values())',
              ]
          if (len(source_edits) != 2
                  or any(actual[:5] != expected[:5] for actual, expected in zip(source_edits, expected_edits))
                  or [ast.dump(ast.parse(line[1:].strip())) for line in source_edits]
                  != [ast.dump(ast.parse(line[1:].strip())) for line in expected_edits]):
              raise SystemExit("Review handoff rejected a source edit outside the approved assignment")

          # Require the same exact branch head immediately before opening the
          # review. Never trust a previously compared SHA after a concurrent
          # worker updates the managed branch.
          latest_ref = request("GET", "/git/ref/heads/" + branch)
          if (latest_ref.get("object") or {}).get("sha") != sha:
              raise SystemExit("Review handoff rejected a branch movement after comparison")

          # A three-dot comparison uses the merge base. After a squash merge
          # it can still show the original patch even when main already has
          # the candidate bytes. Check the current file before any side effect.
          main_ref = request("GET", "/git/ref/heads/main")
          main_sha = (main_ref.get("object") or {}).get("sha")
          if not isinstance(main_sha, str) or not re.fullmatch(r"[a-f0-9]{40}", main_sha):
              raise SystemExit("Review handoff could not pin current main")
          source_path = changed["filename"]
          blobs = []
          for revision in (main_sha, sha):
              source = request("GET", "/contents/" + source_path + "?ref=" + revision)
              blob_sha = source.get("sha") if isinstance(source, dict) else None
              if (not isinstance(source, dict) or source.get("type") != "file"
                      or source.get("path") != source_path
                      or not isinstance(blob_sha, str)
                      or not re.fullmatch(r"[a-f0-9]{40}", blob_sha)):
                  raise SystemExit("Review handoff received invalid source blob evidence")
              blobs.append(blob_sha)
          if blobs[0] == blobs[1]:
              print("Source already present in main; no PR or CI requested: " + sha)
              raise SystemExit(0)

          # Preserve independently testable evidence even when GitHub Actions
          # policy blocks its GITHUB_TOKEN from creating pull requests. A
          # refused PR still fails this job; it must not silently claim
          # end-to-end autonomous delivery.
          if source_path == "src/production_os/worktree_contract.py":
              request("POST", "/actions/workflows/production-os-source-qualification.yml/dispatches", {
                  "ref": branch,
                  "inputs": {"expected_sha": sha},
              })
          else:
              request("POST", "/actions/workflows/production-os-review-state-qualification.yml/dispatches", {
                  "ref": branch,
                  "inputs": {"expected_sha": sha},
              })
          print("Requested immutable source CI for " + sha, flush=True)

          owner = repo.split("/", 1)[0]
          query = urllib.parse.urlencode({
              "state": "open", "head": owner + ":" + branch, "base": "main",
              "per_page": "20",
          })
          existing = request("GET", "/pulls?" + query)
          if not isinstance(existing, list):
              raise SystemExit("Pull request list returned an invalid response")
          for item in existing:
              if ((item.get("head") or {}).get("ref") == branch
                      and (item.get("base") or {}).get("ref") == "main"):
                  print("Reused existing review: " + str(item.get("html_url") or ""))
                  break
          else:
              created = request("POST", "/pulls", {
                  "title": "Review Production-OS verified checkpoint: " + branch,
                  "head": branch,
                  "base": "main",
                  "draft": True,
                  "body": (
                      "Production-OS published this checkpoint to a review branch. "
                      "This PR was opened by the trusted target-repository handoff "
                      "after independently validating the exact branch tip and diff. "
                      "Review all changed files and run required CI before any merge. "
                      "No changes are merged automatically.\n\n"
                      "Checkpoint: `" + sha + "`"
                  ),
              })
              if not isinstance(created, dict) or not created.get("number"):
                  raise SystemExit("Review handoff did not receive a real PR number")
              print("Opened draft review: " + str(created.get("html_url") or ""))
          PY
