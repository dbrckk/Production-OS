name: Fix release metadata handling

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-release-metadata.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch release metadata handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/production_os/release_ledger.py")
          text = path.read_text()
          old = (
              '            if workflow_row is None:\n'
              '                raise KeyError(workflow_id)\n'
              '            if workflow_row["status"] != "succeeded":\n'
              '                raise RuntimeError(\n'
              '                    "workflow must be succeeded before promotion"\n'
              '                )\n'
              '\n'
              '            workflow_metadata = json.loads(\n'
              '                workflow_row["metadata_json"]\n'
              '            )\n'
              '            if bool(workflow_metadata.get("superseded", False)):\n'
              '                raise RuntimeError(\n'
              '                    "stale workflow generation: workflow is superseded"\n'
              '                )\n'
          )
          new = (
              '            if workflow_row is None:\n'
              '                raise KeyError(workflow_id)\n'
              '            workflow_metadata = json.loads(\n'
              '                workflow_row["metadata_json"]\n'
              '            ) or {}\n'
              '            if bool(workflow_metadata.get("superseded", False)):\n'
              '                raise RuntimeError(\n'
              '                    "stale workflow generation: workflow is superseded"\n'
              '                )\n'
              '            if workflow_row["status"] != "succeeded":\n'
              '                raise RuntimeError(\n'
              '                    "workflow must be succeeded before promotion"\n'
              '                )\n'
          )
          if old not in text:
              raise SystemExit("workflow metadata block not found")
          text = text.replace(old, new, 1)
          old_artifact = (
              '            artifact_metadata = json.loads(\n'
              '                artifact_row["metadata_json"]\n'
              '            )\n'
          )
          new_artifact = (
              '            artifact_metadata = json.loads(\n'
              '                artifact_row["metadata_json"]\n'
              '            ) or {}\n'
          )
          if old_artifact not in text:
              raise SystemExit("artifact metadata block not found")
          text = text.replace(old_artifact, new_artifact, 1)
          path.write_text(text)
          PY
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Targeted release tests
        run: |
          pytest -q \
            tests/test_release_ledger.py::test_promotion_rejects_superseded_workflow \
            tests/test_release_ledger.py::test_release_ledger_promotes_ed25519_attestation \
            tests/test_release_ledger.py::test_release_is_anchored_in_transparency_chain \
            tests/test_release_ledger.py::test_release_ledger_promotes_strict_dual_sign_bundle \
            tests/test_secure_release_e2e.py \
            tests/test_control_plane_release.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/production_os/release_ledger.py
          git commit -m "fix(release): handle nullable workflow metadata safely"
          git push
