name: Bounded source qualification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed immutable candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-qualification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify immutable handoff before checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import re

          expected = os.environ['EXPECTED_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('Qualification requires a valid immutable commit SHA')
          if os.environ['REPOSITORY'] != 'dbrckk/Production-OS':
              raise SystemExit('Qualification must run in the trusted repository')
          if not re.fullmatch(r'refs/heads/studio/mp-[a-f0-9]{24}',
                              os.environ['DISPATCH_REF']):
              raise SystemExit('Qualification only accepts reviewed Studio source branches')
          if os.environ['DISPATCH_SHA'] != expected:
              raise SystemExit('Dispatch SHA differs from the independently reviewed commit')
          print('Trusted source qualification pinned to ' + expected)
          PY
      - name: Checkout reviewed source at immutable SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}
      - name: Verify checkout matches the reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git status --porcelain
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -W error::SyntaxWarning -m compileall -q src scripts
      - name: Existing worktree and runner checks
        run: pytest -q tests/test_worktree_contract.py tests/test_executor_worktree.py tests/test_remote_worker_runner.py
      - name: Create real worktrees for adversarial identifiers
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from production_os.worktree_contract import build_worktree_contract

          def git(root, *args):
              return subprocess.run(["git", "-C", str(root), *args],
                                    check=True, capture_output=True, text=True)

          with TemporaryDirectory() as directory:
              root = Path(directory) / "repository"
              root.mkdir()
              git(root, "init")
              git(root, "-c", "user.name=Qualification", "-c",
                  "user.email=qualification@example.invalid", "commit",
                  "--allow-empty", "-m", "Initial")
              cases = [
                  ("workflow", "task"),
                  ("workflow..retry", "task"),
                  ("workflow", "task..retry"),
                  ("workflow...retry", "task...retry"),
                  ("workflow.lock", "task"),
                  ("a" * 15 + ".lock.extra", "a" * 27 + "..retry"),
                  (".", "..."),
                  ("é / branch", "refs/@{bad}"),
              ]
              seen = set()
              for index, (workflow, task) in enumerate(cases):
                  contract = build_worktree_contract(
                      repository="owner/repo", workflow_id=workflow,
                      task_id=task, attempt=1,
                  )
                  assert contract == build_worktree_contract(
                      repository="owner/repo", workflow_id=workflow,
                      task_id=task, attempt=1,
                  )
                  assert contract["branch"] not in seen
                  seen.add(contract["branch"])
                  git(root, "check-ref-format", "--branch", contract["branch"])
                  destination = Path(directory) / ("worktree-" + str(index))
                  git(root, "worktree", "add", "-b", contract["branch"], str(destination))
                  assert (destination / ".git").is_file()
                  git(root, "worktree", "remove", str(destination))
          print("PASS: eight real Git worktrees, valid refs and deterministic isolation")
          PY
      - name: Build distribution
        run: python -m build
