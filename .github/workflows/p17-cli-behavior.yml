name: P17 CLI behavior patch

on:
  push:
    branches: [feat/external-transparency-receipts]
    paths:
      - .github/workflows/p17-cli-behavior.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire authenticated Rekor publication and verification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/production_os/cli.py")
          text = path.read_text()

          import_anchor = "from .asymmetric_attestations import (\n"
          import_block = (
              "from .transparency_receipts import (\n"
              "    RekorV1Publisher,\n"
              "    verify_rekor_v1_receipt,\n"
              ")\n"
          )
          if import_anchor not in text:
              raise SystemExit("transparency receipt import anchor not found")
          if "from .transparency_receipts import (" not in text:
              text = text.replace(import_anchor, import_block + import_anchor, 1)

          start = text.index("def run_transparency_checkpoint(\n")
          verify_start = text.index(
              "\ndef run_transparency_checkpoint_verify(\n",
              start,
          )
          block = text[start:verify_start]
          render_anchor = (
              "    rendered=json.dumps(result,indent=2,ensure_ascii=False)\n"
          )
          if render_anchor not in block:
              raise SystemExit("checkpoint render anchor not found")
          rekor_block = '''    rekor_url=getattr(args,"rekor_url",None)
              receipt_output=getattr(args,"receipt_output",None)
              if rekor_url:
                  rekor_private_key=getattr(args,"rekor_private_key",None)
                  rekor_log_public_key=getattr(
                      args,"rekor_log_public_key",None
                  )
                  if not rekor_private_key:
                      raise RuntimeError(
                          "Rekor signing private key is required"
                      )
                  if not rekor_log_public_key:
                      raise RuntimeError(
                          "Rekor log public key is required"
                      )
                  publisher=RekorV1Publisher.from_private_key(
                      rekor_url,
                      private_key_pem=Path(rekor_private_key).read_text(
                          encoding="ascii"
                      ),
                      log_public_key_pem=Path(
                          rekor_log_public_key
                      ).read_text(encoding="ascii"),
                  )
                  receipt=publisher.publish(envelope)
                  result["rekor_receipt"]=receipt
                  if receipt_output:
                      Path(receipt_output).write_text(
                          json.dumps(
                              receipt,
                              indent=2,
                              ensure_ascii=False,
                          )+"\\n",
                          encoding="utf-8",
                      )
              elif receipt_output:
                  raise RuntimeError(
                      "--receipt-output requires --rekor-url"
                  )
          '''
          block = block.replace(
              render_anchor,
              rekor_block + render_anchor,
              1,
          )
          text = text[:start] + block + text[verify_start:]

          verify_start = text.index(
              "def run_transparency_checkpoint_verify(\n"
          )
          verify_end = text.index("\ndef run_slsa_verify(", verify_start)
          new_verify = '''def run_transparency_checkpoint_verify(
              args: argparse.Namespace,
          ) -> int:
              envelope=json.loads(
                  Path(args.checkpoint).read_text(encoding="utf-8")
              )
              checkpoint_valid=verify_checkpoint(
                  dict(envelope),
                  public_key_pem=Path(args.public_key).read_text(
                      encoding="ascii"
                  ),
                  expected_root_hash=args.root_hash,
              )
              receipt_path=getattr(args,"receipt",None)
              receipt_valid=None
              if receipt_path:
                  log_key_path=getattr(
                      args,"rekor_log_public_key",None
                  )
                  if not log_key_path:
                      raise RuntimeError(
                          "Rekor log public key is required to verify a receipt"
                      )
                  receipt=json.loads(
                      Path(receipt_path).read_text(encoding="utf-8")
                  )
                  receipt_valid=verify_rekor_v1_receipt(
                      dict(receipt),
                      envelope=dict(envelope),
                      expected_log_id=getattr(
                          args,"rekor_log_id",None
                      ),
                      log_public_key_pem=Path(
                          log_key_path
                      ).read_text(encoding="ascii"),
                  )
              valid=bool(checkpoint_valid) and receipt_valid is not False
              result={
                  "schema_version":
                      "production-os/transparency-witness-verification/v1",
                  "valid":valid,
              }
              if receipt_valid is not None:
                  result["checkpoint_valid"]=bool(checkpoint_valid)
                  result["receipt_valid"]=bool(receipt_valid)
              print(json.dumps(result,indent=2,ensure_ascii=False))
              return 0 if valid else 9
          '''
          text = text[:verify_start] + new_verify + text[verify_end:]
          path.write_text(text)
          PY
      - name: Verify Rekor CLI behavior
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q tests/test_cli.py tests/test_transparency_cli.py tests/test_transparency_receipts.py
      - name: Commit implementation and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p17-cli-behavior.yml
          git add src/production_os/cli.py
          git commit -m "feat(cli): publish and verify Rekor receipts"
          git push
