name: P17 CLI parser patch

on:
  push:
    branches: [feat/external-transparency-receipts]
    paths:
      - .github/workflows/p17-cli-parser.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Rekor parser options
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/production_os/cli.py")
          text = path.read_text()

          publish_anchor = '    checkpoint.add_argument("--bearer-token-env")\n'
          publish_extra = (
              publish_anchor
              + '    checkpoint.add_argument("--rekor-url")\n'
              + '    checkpoint.add_argument("--rekor-private-key")\n'
              + '    checkpoint.add_argument("--rekor-log-public-key")\n'
              + '    checkpoint.add_argument("--receipt-output")\n'
          )
          if publish_anchor not in text:
              raise SystemExit("checkpoint publication parser anchor not found")
          text = text.replace(publish_anchor, publish_extra, 1)

          verify_anchor = '    checkpointverify.add_argument("--root-hash")\n'
          verify_extra = (
              verify_anchor
              + '    checkpointverify.add_argument("--receipt")\n'
              + '    checkpointverify.add_argument("--rekor-log-public-key")\n'
              + '    checkpointverify.add_argument("--rekor-log-id")\n'
          )
          if verify_anchor not in text:
              raise SystemExit("checkpoint verification parser anchor not found")
          text = text.replace(verify_anchor, verify_extra, 1)
          path.write_text(text)
          PY
      - name: Verify parser change
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q tests/test_cli.py
      - name: Commit parser and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p17-cli-parser.yml
          git add src/production_os/cli.py
          git commit -m "feat(cli): register Rekor transparency options"
          git push
