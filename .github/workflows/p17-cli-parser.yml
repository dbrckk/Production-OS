name: P17 CLI parser patch

on:
  push:
    branches: [feat/external-transparency-receipts]
    paths:
      - .github/workflows/p17-cli-parser.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Rekor parser options
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/production_os/cli.py")
          text = path.read_text()
          old = '''    checkpoint = sub.add_parser(
              "transparency-checkpoint",
              help="Create and optionally publish a signed transparency root",
          )
          checkpoint.add_argument("--database", required=True)
          checkpoint.add_argument("--private-key")
          checkpoint.add_argument("--witness-signer-uri")
          checkpoint.add_argument("--witness-signer-key-id")
          checkpoint.add_argument("--witness-signer-token-env")
          checkpoint.add_argument("--output")
          checkpoint.add_argument("--publish-url")
          checkpoint.add_argument("--bearer-token-env")

          checkpointverify = sub.add_parser(
              "transparency-checkpoint-verify",
              help="Offline verify a signed transparency checkpoint",
          )
          checkpointverify.add_argument("--checkpoint", required=True)
          checkpointverify.add_argument("--public-key", required=True)
          checkpointverify.add_argument("--root-hash")
          '''
          new = '''    checkpoint = sub.add_parser(
              "transparency-checkpoint",
              help="Create and optionally publish a signed transparency root",
          )
          checkpoint.add_argument("--database", required=True)
          checkpoint.add_argument("--private-key")
          checkpoint.add_argument("--witness-signer-uri")
          checkpoint.add_argument("--witness-signer-key-id")
          checkpoint.add_argument("--witness-signer-token-env")
          checkpoint.add_argument("--output")
          checkpoint.add_argument("--publish-url")
          checkpoint.add_argument("--bearer-token-env")
          checkpoint.add_argument("--rekor-url")
          checkpoint.add_argument("--rekor-private-key")
          checkpoint.add_argument("--rekor-log-public-key")
          checkpoint.add_argument("--receipt-output")

          checkpointverify = sub.add_parser(
              "transparency-checkpoint-verify",
              help="Offline verify a signed transparency checkpoint",
          )
          checkpointverify.add_argument("--checkpoint", required=True)
          checkpointverify.add_argument("--public-key", required=True)
          checkpointverify.add_argument("--root-hash")
          checkpointverify.add_argument("--receipt")
          checkpointverify.add_argument("--rekor-log-public-key")
          checkpointverify.add_argument("--rekor-log-id")
          '''
          if old not in text:
              raise SystemExit("checkpoint parser block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify parser change
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q tests/test_cli.py
      - name: Commit parser and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p17-cli-parser.yml
          git add src/production_os/cli.py
          git commit -m "feat(cli): register Rekor transparency options"
          git push
