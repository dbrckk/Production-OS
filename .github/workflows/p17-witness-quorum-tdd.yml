name: P17 witness quorum TDD

on:
  push:
    branches: [feat/witness-quorum]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Targeted witness quorum tests
        run: pytest -q tests/test_rekor_witness_quorum.py
