name: Repair CI test contracts

on:
  push:
    branches: [chore/remove-repair-workflows]
    paths:
      - .github/workflows/repair-ci-test-contracts.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align tests with current release security contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: expected block not found")
              return text.replace(old, new, 1)

          path = Path("tests/test_release_ledger.py")
          text = path.read_text()

          text = replace_once(
              text,
              '''        releases.promote(\n            workflow_id=workflow["id"],\n            artifact_id=artifact["id"],\n            validation=passed_validation(),\n            attestation={},\n        )\n''',
              '''        releases.promote(\n            workflow_id=workflow["id"],\n            artifact_id=artifact["id"],\n            validation=passed_validation(),\n            attestation={},\n            approval=approval(),\n        )\n''',
              "artifact sha approval fixture",
          )

          text = replace_once(
              text,
              '''    release=releases.promote(\n        workflow_id=workflow["id"],\n        artifact_id=artifact["id"],\n        validation=passed_validation(),\n        attestation=signed_attestation(workflow,artifact),\n    )\n\n    verification=releases.verify(release["id"])\n''',
              '''    release=releases.promote(\n        workflow_id=workflow["id"],\n        artifact_id=artifact["id"],\n        validation=passed_validation(),\n        attestation=signed_attestation(workflow,artifact),\n        approval=approval(),\n    )\n\n    verification=releases.verify(release["id"])\n''',
              "full-chain approval fixture",
          )

          text = replace_once(
              text,
              '''    release_private,release_public=generate_keypair()\n    builder_id="https://builder.example/prod"\n    releases=ReleaseLedger(\n        backend,\n        workflows,\n        trusted_validation_public_keys={\n            "validator-v2":validator_public\n        },\n        provenance_private_key=release_private,\n        provenance_public_key=release_public,\n        builder_id=builder_id,\n        builder_private_key=release_private,\n        trusted_builders={\n            builder_id:{\n                "key_owner":"release-builder",\n                "allowed_repositories":[workflow["repository"]],\n            }\n        },\n        trusted_builder_keys={\n            "release-builder":{"public_key":release_public}\n        },\n        require_trusted_builder=True,\n    )\n''',
              '''    release_private,release_public=generate_keypair()\n    builder_private,builder_public=generate_keypair()\n    builder_id="https://builder.example/prod"\n    releases=ReleaseLedger(\n        backend,\n        workflows,\n        trusted_validation_public_keys={\n            "validator-v2":validator_public\n        },\n        provenance_private_key=release_private,\n        provenance_public_key=release_public,\n        builder_id=builder_id,\n        builder_private_key=builder_private,\n        trusted_builders={\n            builder_id:{\n                "key_owner":"release-builder",\n                "allowed_repositories":[workflow["repository"]],\n            }\n        },\n        trusted_builder_keys={\n            "release-builder":{"public_key":builder_public}\n        },\n        require_trusted_builder=True,\n    )\n''',
              "trusted builder separation fixture",
          )

          text = replace_once(
              text,
              '''    release_private,release_public=generate_keypair()\n    builder_id="https://builder.example/prod"\n    releases=ReleaseLedger(\n        backend,\n        workflows,\n        trusted_validation_public_keys={\n            "validator-v2":validator_public\n        },\n        provenance_private_key=release_private,\n        provenance_public_key=release_public,\n        builder_id=builder_id,\n        trusted_builders={\n            builder_id:{\n                "key_owner":"release-builder",\n                "allowed_repositories":["other/repo"],\n            }\n        },\n        trusted_builder_keys={\n            "release-builder":{"public_key":release_public}\n        },\n        require_trusted_builder=True,\n    )\n''',
              '''    release_private,release_public=generate_keypair()\n    builder_private,builder_public=generate_keypair()\n    builder_id="https://builder.example/prod"\n    releases=ReleaseLedger(\n        backend,\n        workflows,\n        trusted_validation_public_keys={\n            "validator-v2":validator_public\n        },\n        provenance_private_key=release_private,\n        provenance_public_key=release_public,\n        builder_id=builder_id,\n        builder_private_key=builder_private,\n        trusted_builders={\n            builder_id:{\n                "key_owner":"release-builder",\n                "allowed_repositories":["other/repo"],\n            }\n        },\n        trusted_builder_keys={\n            "release-builder":{"public_key":builder_public}\n        },\n        require_trusted_builder=True,\n    )\n''',
              "untrusted repo builder fixture",
          )

          text = replace_once(
              text,
              '''    _,release_public=generate_keypair()\n    import pytest\n    releases=ReleaseLedger(\n        backend,\n        workflows,\n        provenance_private_key="configured-later",\n        provenance_public_key=release_public,\n        builder_id="https://builder.example/prod",\n        trusted_builders={\n            "https://builder.example/prod":{\n                "key_owner":"builder"\n            }\n        },\n        trusted_builder_keys={\n            "builder":{"public_key":release_public}\n        },\n        require_trusted_builder=True,\n    )\n''',
              '''    provenance_private,provenance_public=generate_keypair()\n    _,builder_public=generate_keypair()\n    releases=ReleaseLedger(\n        backend,\n        workflows,\n        provenance_private_key=provenance_private,\n        provenance_public_key=provenance_public,\n        builder_id="https://builder.example/prod",\n        trusted_builders={\n            "https://builder.example/prod":{\n                "key_owner":"builder"\n            }\n        },\n        trusted_builder_keys={\n            "builder":{"public_key":builder_public}\n        },\n        require_trusted_builder=True,\n    )\n''',
              "dedicated builder signer fixture",
          )

          path.write_text(text)

          path = Path("tests/test_trust_status_summary.py")
          text = path.read_text()
          old = '"validation_attestation":{"validator_id":"v1"}'
          new = ('"validation_attestation":{"validator_id":"v1",'
                 '"signature":{"key_id":"sha256:deadbeef"}}')
          if old not in text:
              raise SystemExit("incident key-id fixture: expected block not found")
          text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Run targeted tests
        run: |
          python -m pip install -e ".[dev]"
          pytest -q \
            tests/test_release_ledger.py::test_promotion_requires_artifact_sha256 \
            tests/test_release_ledger.py::test_release_verification_checks_full_chain \
            tests/test_release_ledger.py::test_release_verify_enforces_trusted_builder_repository \
            tests/test_release_ledger.py::test_release_verify_rejects_untrusted_builder_repository \
            tests/test_release_ledger.py::test_trusted_builder_requires_dedicated_signing_key \
            tests/test_trust_status_summary.py::test_incident_report_id_is_stable_for_same_blast_radius
      - name: Commit test alignment and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-ci-test-contracts.yml
          git add tests/test_release_ledger.py tests/test_trust_status_summary.py
          git commit -m "test(release): align fixtures with security contracts"
          git push
