name: P17 integrate checkpoint state

on:
  push:
    branches:
      - feat/rekor-checkpoint-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rekor-checkpoint-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply CLI integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/production_os/cli.py')
          text = path.read_text(encoding='utf-8')

          import_needle = '''from .transparency_receipts import (
              RekorV1Publisher,
              verify_rekor_v1_receipt,
          )
          '''
          import_replacement = import_needle + '''from .rekor_checkpoint_state import (
              RekorCheckpointMonitor,
              RekorCheckpointStateStore,
              RekorV1ConsistencyClient,
          )
          '''
          if 'from .rekor_checkpoint_state import (' not in text:
              if import_needle not in text:
                  raise SystemExit('transparency receipt import block not found')
              text = text.replace(import_needle, import_replacement, 1)

          code_needle = '''        receipt=publisher.publish(envelope)
                  result["rekor_receipt"]=receipt
                  if receipt_output:
          '''
          code_replacement = '''        receipt=publisher.publish(envelope)
                  checkpoint_state=RekorCheckpointMonitor(
                      RekorCheckpointStateStore(ledger.backend),
                      proof_fetcher=RekorV1ConsistencyClient(
                          rekor_url
                      ).fetch,
                  ).observe_verified_receipt(receipt)
                  result["rekor_checkpoint_state"]=checkpoint_state
                  result["rekor_receipt"]=receipt
                  if receipt_output:
          '''
          if 'result["rekor_checkpoint_state"]=checkpoint_state' not in text:
              if code_needle not in text:
                  raise SystemExit('Rekor publication block not found')
              text = text.replace(code_needle, code_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify targeted tests
        run: |
          python -m pip install -e ".[dev,postgres]"
          pytest -q tests/test_rekor_checkpoint_state.py tests/test_rekor_consistency_client.py tests/test_rekor_checkpoint_state_cli.py
      - name: Commit integration and remove helper
        run: |
          rm .github/workflows/p17-integrate-checkpoint-state.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/production_os/cli.py .github/workflows/p17-integrate-checkpoint-state.yml
          git commit -m "feat(transparency): enforce checkpoint consistency on publish"
          git push origin HEAD:feat/rekor-checkpoint-state
