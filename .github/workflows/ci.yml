name: CI

# Canonical verification gate. One-shot repair workflows must not persist on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,postgres]"

      - name: Compile
        run: python -W error::SyntaxWarning -m compileall -q src scripts

      - name: Compatibility tests
        run: pytest -q -m "not e2e"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: production_os
          POSTGRES_PASSWORD: production_os
          POSTGRES_DB: production_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U production_os -d production_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRODUCTION_OS_TEST_POSTGRES: postgresql://production_os:production_os@127.0.0.1:5432/production_os_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,postgres]"

      - name: Compile
        run: python -W error::SyntaxWarning -m compileall -q src scripts

      - name: Unit tests
        run: pytest -q -m "not e2e"

      - name: Production E2E
        run: pytest -q -m e2e

      - name: Build distribution
        run: python -m build

      - name: Verify wheel install
        run: |
          python -m venv /tmp/production-os-wheel
          /tmp/production-os-wheel/bin/python -m pip install --upgrade pip
          /tmp/production-os-wheel/bin/python -m pip install dist/*.whl
          /tmp/production-os-wheel/bin/production-os --help

      - name: Docker image smoke test
        run: |
          docker build -t production-os:ci .
          docker run --rm production-os:ci --help

      - name: Browser worker image smoke test
        run: |
          docker build -f Dockerfile.browser-worker -t production-os-browser:ci .
          docker run --rm --entrypoint python production-os-browser:ci -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); page=b.new_page(); page.set_content('<title>browser-smoke</title>'); assert page.title() == 'browser-smoke'; b.close(); p.stop()"

      - name: Mobile worker Dockerfile validation
        run: docker build --check -f Dockerfile.mobile-worker .

      - name: CLI smoke test
        run: production-os --help

      - name: Smoke-check remote batch receipt integrity offline
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import zipfile
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from production_os.asset_forge import (
              build_asset_forge_request,
              execute_asset_forge_batch,
          )

          # Test the real remote batch parser/delivery boundary using a local
          # ZIP and an in-memory Actions client, without dispatching anything.
          class OfflineClient:
              def __init__(self, archive):
                  self.archive = archive
                  self.correlation = None

              def can_dispatch_workflow(self, *_args):
                  return True

              def dispatch_workflow(self, _repository, _workflow, *, ref, inputs):
                  self.correlation = inputs["correlation_id"]

              def wait_for_workflow_run(self, *_args, **_kwargs):
                  return {"id": 77, "conclusion": "success"}

              def workflow_run_artifacts(self, *_args):
                  return [{
                      "id": 88,
                      "name": "asset-forge-batch-" + self.correlation,
                      "expired": False,
                  }]

              def download_workflow_artifact(self, *_args):
                  return self.archive

          items = []
          rows = []
          for name in ("a", "b"):
              request = build_asset_forge_request(
                  request_id="remote-" + name,
                  project="offline-smoke",
                  asset_id="remote-" + name,
                  asset_type="sprite-sheet",
                  instruction="Verify offline remote batch correlation",
                  target_format="png",
              )
              target = "assets/art/remote-" + name + ".png"
              items.append({"id": name, "request": request, "target_path": target})
              payload = ("fake-byte-content-" + name).encode()
              rows.append({
                  "id": name,
                  "depends_on": [],
                  "request_id": "remote-" + name,
                  "target_path": target,
                  "artifact": "bundle/" + name + ".png",
                  "sha256": hashlib.sha256(payload).hexdigest(),
              })

          def archive_for(receipts, *, scenario="valid"):
              report = {
                  "schema_version": "asset-forge/remote-batch-result/v1",
                  "success": True,
                  "count": 2,
                  "items": receipts,
              }
              output = io.BytesIO()
              with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as zf:
                  zf.writestr("batch-result.json", json.dumps(report))
                  for name in ("a", "b"):
                      zf.writestr("bundle/" + name + ".png",
                                  ("fake-byte-content-" + name).encode())
                      if scenario == "missing-report" and name == "b":
                          continue
                      reported_request = (
                          "remote-a"
                          if scenario == "wrong-report-id" and name == "b"
                          else "remote-" + name
                      )
                      zf.writestr(
                          "jobs/remote-" + name + "/production-report.json",
                          json.dumps({
                              "schema": "asset-forge/production-report/v1",
                              "requestId": reported_request,
                              "assetId": "remote-" + name,
                              "assetType": "sprite-sheet",
                              "success": True,
                          }),
                      )
              return output.getvalue()

          with TemporaryDirectory() as temporary:
              root = Path(temporary)
              cases = [
                  ("valid", rows, True),
                  ("duplicate", [rows[0], dict(rows[0])], False),
                  ("wrong-request-id", [
                      rows[0], {**rows[1], "request_id": "remote-a"},
                  ], False),
                  ("unknown-item", [
                      rows[0], {**rows[1], "id": "other"},
                  ], False),
                  ("missing-report", rows, False),
                  ("wrong-report-id", rows, False),
              ]
              for name, receipts, allowed in cases:
                  target = root / (name + "-worktree")
                  client = OfflineClient(archive_for(receipts, scenario=name))
                  try:
                      result = execute_asset_forge_batch(
                          items,
                          mode="github",
                          output_root=str(root / (name + "-output")),
                          target_worktree=str(target),
                          client=client,
                      )
                  except RuntimeError:
                      if allowed:
                          raise
                  else:
                      if not allowed:
                          raise AssertionError("invalid remote receipts accepted: " + name)
                      assert result["success"] is True
                      assert result["count"] == 2
                      assert (target / "assets/art/remote-a.png").read_bytes() == b"fake-byte-content-a"
                      assert (target / "assets/art/remote-b.png").read_bytes() == b"fake-byte-content-b"
                  if not allowed:
                      assert not (target / "assets/art/remote-a.png").exists()
                      assert not (target / "assets/art/remote-b.png").exists()
          print("PASS: real remote batch parser rejects duplicate/mismatched receipts before delivery")
          PY
