name: P17 fix CLI checkpoint fixture

on:
  push:
    branches:
      - feat/rekor-signed-checkpoint-verification
    paths:
      - .github/workflows/p17-fix-cli-checkpoint-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rekor-signed-checkpoint-verification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fixture fix
        run: python .github/p17_fix_cli_checkpoint_fixture.py
      - name: Verify affected tests
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q tests/test_transparency_cli.py tests/test_rekor_signed_checkpoint.py tests/test_rekor_signed_checkpoint_receipt.py tests/test_transparency_receipts.py
      - name: Commit fix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/p17-fix-cli-checkpoint-fixture.yml
          rm .github/p17_fix_cli_checkpoint_fixture.py
          git add tests/test_transparency_cli.py .github/workflows/p17-fix-cli-checkpoint-fixture.yml .github/p17_fix_cli_checkpoint_fixture.py
          git commit -m "test(transparency): sign Rekor CLI checkpoint fixture"
          git push
