name: P17 refresh CLI fixture

on:
  push:
    branches:
      - feat/rekor-checkpoint-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rekor-checkpoint-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh legacy Rekor publication fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_transparency_cli.py')
          text = path.read_text(encoding='utf-8')

          import_needle = 'from production_os.signing import generate_keypair\n'
          if 'from production_os.sqlite_backend import SQLiteBackend\n' not in text:
              text = text.replace(
                  import_needle,
                  import_needle + 'from production_os.sqlite_backend import SQLiteBackend\n',
                  1,
              )

          function_marker = 'def test_checkpoint_publication_writes_rekor_receipt(tmp_path, monkeypatch, capsys):\n'
          start = text.index(function_marker)
          tail = text[start:]

          receipt_anchor = '    receipt_path = tmp_path / "receipt.json"\n'
          if 'publication_state = SQLiteBackend' not in tail:
              tail = tail.replace(
                  receipt_anchor,
                  receipt_anchor + '    publication_state = SQLiteBackend(tmp_path / "publication-state.db")\n',
                  1,
              )

          ledger_anchor = '''    class Ledger:\n        def verify_transparency(self):\n'''
          if '        backend = publication_state\n' not in tail:
              tail = tail.replace(
                  ledger_anchor,
                  '''    class Ledger:\n        backend = publication_state\n\n        def verify_transparency(self):\n''',
                  1,
              )

          old_return = '''            return {\n                "schema_version": RECEIPT_SCHEMA,\n                "provider": "rekor-v1",\n                "checkpoint_sha256": "c" * 64,\n                "entry_uuid": "b" * 64,\n                "log_id": "a" * 64,\n                "log_index": 4,\n                "integrated_time": 1_789_490_000,\n                "proof_verified": True,\n            }\n'''
          new_return = '''            root_hash = hashlib.sha256(b"fake-rekor-root").hexdigest()\n            root_b64 = base64.b64encode(bytes.fromhex(root_hash)).decode("ascii")\n            checkpoint = (\n                "rekor.example - 42\\n"\n                "1\\n"\n                f"{root_b64}\\n"\n                "\\n"\n                "— rekor.example already-verified\\n"\n            )\n            return {\n                "schema_version": RECEIPT_SCHEMA,\n                "provider": "rekor-v1",\n                "checkpoint_sha256": "c" * 64,\n                "entry_uuid": "b" * 64,\n                "log_id": "a" * 64,\n                "log_index": 4,\n                "integrated_time": 1_789_490_000,\n                "proof_verified": True,\n                "inclusion_proof": {\n                    "treeSize": 1,\n                    "rootHash": root_hash,\n                    "checkpoint": checkpoint,\n                },\n            }\n'''
          if '"inclusion_proof": {' not in tail:
              if old_return not in tail:
                  raise SystemExit('legacy fake receipt block not found')
              tail = tail.replace(old_return, new_return, 1)

          text = text[:start] + tail
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify affected CLI tests
        run: |
          python -m pip install -e ".[dev,postgres]"
          pytest -q tests/test_transparency_cli.py tests/test_rekor_checkpoint_state_cli.py
      - name: Commit fixture and remove helper
        run: |
          rm .github/workflows/p17-refresh-cli-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_transparency_cli.py .github/workflows/p17-refresh-cli-fixture.yml
          git commit -m "test(transparency): refresh Rekor publication fixture"
          git push origin HEAD:feat/rekor-checkpoint-state
