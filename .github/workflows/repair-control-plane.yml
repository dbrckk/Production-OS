name: Repair control-plane

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-control-plane.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore release signer imports
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/production_os/release_ledger.py")
          text = path.read_text()
          import_line = "from .signers import Signer, coerce_signer\n"
          if import_line not in text:
              marker = "import uuid\n\n"
              if marker not in text:
                  raise SystemExit("release_ledger import marker not found")
              text = text.replace(marker, marker + import_line, 1)
          path.write_text(text)
          PY
      - name: Compile check
        run: python -m compileall -q src
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Smoke control-plane construction
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from production_os.api_auth import TokenAuthorizer
          from production_os.control_plane import ControlPlane

          with tempfile.TemporaryDirectory() as directory:
              ControlPlane(
                  str(Path(directory) / "control.db"),
                  authorizer=TokenAuthorizer([]),
              )
          PY
      - name: Commit signer import repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/production_os/release_ledger.py
          git diff --cached --quiet || git commit -m "fix(release): restore signer coercion imports"
          git push
