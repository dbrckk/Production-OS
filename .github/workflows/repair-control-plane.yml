name: Repair control-plane

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-control-plane.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden HTTP method handling and server fingerprint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/production_os/control_plane.py")
          text = path.read_text()

          old_version = '        server_version = "ProductionOS/0.8"\n'
          new_version = (
              '        server_version = "ProductionOS"\n'
              '\n'
              '        def version_string(self) -> str:\n'
              '            return self.server_version\n'
          )
          if old_version not in text:
              raise SystemExit("server version marker not found")
          text = text.replace(old_version, new_version, 1)

          old_signature = (
              '        def _send(\n'
              '            self,\n'
              '            status: int,\n'
              '            payload: dict | list,\n'
              '        ) -> None:\n'
          )
          new_signature = (
              '        def _send(\n'
              '            self,\n'
              '            status: int,\n'
              '            payload: dict | list,\n'
              '            *,\n'
              '            headers: dict[str, str] | None = None,\n'
              '        ) -> None:\n'
          )
          if old_signature not in text:
              raise SystemExit("_send signature marker not found")
          text = text.replace(old_signature, new_signature, 1)

          old_tail = (
              '            self.send_header("X-Frame-Options", "DENY")\n'
              '            self.send_header("Referrer-Policy", "no-referrer")\n'
              '            self.end_headers()\n'
              '            try:\n'
              '                self.wfile.write(body)\n'
              '            except (BrokenPipeError, ConnectionResetError):\n'
              '                return\n'
              '\n'
              '        def _read_body(self) -> bytes:\n'
          )
          new_tail = (
              '            self.send_header("X-Frame-Options", "DENY")\n'
              '            self.send_header("Referrer-Policy", "no-referrer")\n'
              '            if headers:\n'
              '                for name, value in headers.items():\n'
              '                    self.send_header(name, value)\n'
              '            self.end_headers()\n'
              '            try:\n'
              '                self.wfile.write(body)\n'
              '            except (BrokenPipeError, ConnectionResetError):\n'
              '                return\n'
              '\n'
              '        def _method_not_allowed(self) -> None:\n'
              '            self._send(\n'
              '                HTTPStatus.METHOD_NOT_ALLOWED,\n'
              '                {"error": "method not allowed"},\n'
              '                headers={"Allow": "GET, POST"},\n'
              '            )\n'
              '\n'
              '        def do_PUT(self) -> None:\n'
              '            self._method_not_allowed()\n'
              '\n'
              '        def do_PATCH(self) -> None:\n'
              '            self._method_not_allowed()\n'
              '\n'
              '        def do_DELETE(self) -> None:\n'
              '            self._method_not_allowed()\n'
              '\n'
              '        def _read_body(self) -> bytes:\n'
          )
          if old_tail not in text:
              raise SystemExit("JSON response tail marker not found")
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text)
          PY
      - name: Compile check
        run: python -m compileall -q src
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify HTTP hardening tests are GREEN
        run: pytest -q tests/test_http_security_headers.py
      - name: Commit HTTP hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/production_os/control_plane.py
          git diff --cached --quiet || git commit -m "fix(api): return 405 and minimize server fingerprint"
          git push
