name: Repair control-plane

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-control-plane.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile check
        run: python -m compileall -q src
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify HTTP hardening tests are RED
        run: pytest -q tests/test_http_security_headers.py
