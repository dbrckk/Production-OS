name: P17 Rekor key compatibility patch

on:
  push:
    branches: [feat/external-transparency-receipts]
    paths:
      - .github/workflows/p17-rekor-key-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restrict hashedrekord submission keys to PKIX-compatible algorithms
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/production_os/transparency_receipts.py")
          text = path.read_text()
          old = '''def _private_key_signer(private_key: Any) -> Callable[[bytes], bytes]:
              if isinstance(private_key, ed25519.Ed25519PrivateKey):
                  return private_key.sign
              if isinstance(private_key, ec.EllipticCurvePrivateKey):
                  return lambda payload: private_key.sign(
                      payload,
                      ec.ECDSA(hashes.SHA256()),
                  )
              if isinstance(private_key, rsa.RSAPrivateKey):
                  return lambda payload: private_key.sign(
                      payload,
                      padding.PKCS1v15(),
                      hashes.SHA256(),
                  )
              raise TransparencyReceiptError("unsupported Rekor signing key type")
          '''
          new = '''def _private_key_signer(private_key: Any) -> Callable[[bytes], bytes]:
              if isinstance(private_key, ec.EllipticCurvePrivateKey):
                  return lambda payload: private_key.sign(
                      payload,
                      ec.ECDSA(hashes.SHA256()),
                  )
              if isinstance(private_key, rsa.RSAPrivateKey):
                  return lambda payload: private_key.sign(
                      payload,
                      padding.PKCS1v15(),
                      hashes.SHA256(),
                  )
              raise TransparencyReceiptError(
                  "Rekor v1 hashedrekord requires a PKIX ECDSA or RSA signing key"
              )
          '''
          if old not in text:
              raise SystemExit("private key signer block not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("tests/test_transparency_receipts.py")
          text = path.read_text()
          leaf_anchor = '''def _leaf_hash(payload: bytes) -> str:
              return hashlib.sha256(b"\\x00" + payload).hexdigest()
          '''
          helper = '''def _rekor_signing_private_pem() -> str:
              private_key = ec.generate_private_key(ec.SECP256R1())
              return private_key.private_bytes(
                  serialization.Encoding.PEM,
                  serialization.PrivateFormat.PKCS8,
                  serialization.NoEncryption(),
              ).decode("ascii")


          '''
          if leaf_anchor not in text:
              raise SystemExit("leaf helper anchor not found")
          if "def _rekor_signing_private_pem()" not in text:
              text = text.replace(leaf_anchor, leaf_anchor + "\n\n" + helper, 1)

          old_factory = '''def test_rekor_v1_publisher_from_private_key_derives_signing_identity():
              private_pem, public_pem = generate_keypair()
              publisher = RekorV1Publisher.from_private_key(
                  "https://rekor.example",
                  private_key_pem=private_pem,
              )

              signature = publisher.signer(b"checkpoint")
              public_key = serialization.load_pem_public_key(
                  public_pem.encode("ascii")
              )
              public_key.verify(signature, b"checkpoint")
              assert publisher.public_key_pem == public_pem
          '''
          new_factory = '''def test_rekor_v1_publisher_from_private_key_derives_signing_identity():
              private_pem = _rekor_signing_private_pem()
              publisher = RekorV1Publisher.from_private_key(
                  "https://rekor.example",
                  private_key_pem=private_pem,
              )

              signature = publisher.signer(b"checkpoint")
              public_key = serialization.load_pem_public_key(
                  publisher.public_key_pem.encode("ascii")
              )
              public_key.verify(
                  signature,
                  b"checkpoint",
                  ec.ECDSA(hashes.SHA256()),
              )
          '''
          if old_factory not in text:
              raise SystemExit("legacy Ed25519 factory test block not found")
          text = text.replace(old_factory, new_factory, 1)
          text = text.replace(
              "    private_pem, _ = generate_keypair()\n\n    class Response:\n",
              "    private_pem = _rekor_signing_private_pem()\n\n    class Response:\n",
              1,
          )
          path.write_text(text)
          PY
      - name: Verify key compatibility fix
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q tests/test_rekor_v1_key_compatibility.py tests/test_transparency_receipts.py tests/test_transparency_cli.py
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p17-rekor-key-compat.yml
          git add src/production_os/transparency_receipts.py tests/test_transparency_receipts.py
          git commit -m "fix(transparency): enforce Rekor v1 PKIX signing keys"
          git push
