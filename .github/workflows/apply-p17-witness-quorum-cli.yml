name: Apply P17 witness quorum CLI integration

on:
  push:
    branches: [feat/witness-quorum]
    paths:
      - .github/workflows/apply-p17-witness-quorum-cli.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/witness-quorum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch CLI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/production_os/cli.py")
          text = path.read_text()

          old_import = '''from .rekor_checkpoint_state import (
              RekorCheckpointMonitor,
              RekorCheckpointStateStore,
              RekorV1ConsistencyClient,
          )
          from .asymmetric_attestations import (
          '''
          new_import = '''from .rekor_checkpoint_state import (
              RekorCheckpointMonitor,
              RekorCheckpointStateStore,
              RekorV1ConsistencyClient,
          )
          from .rekor_witness_quorum import (
              RekorWitnessObservationStore,
              collect_rekor_witness_quorum,
              load_rekor_witness_config,
          )
          from .asymmetric_attestations import (
          '''
          if old_import not in text:
              raise SystemExit("rekor import anchor not found")
          text = text.replace(old_import, new_import, 1)

          old_parser = '''    checkpoint.add_argument("--rekor-log-public-key")
              checkpoint.add_argument("--receipt-output")
          '''
          new_parser = '''    checkpoint.add_argument("--rekor-log-public-key")
              checkpoint.add_argument("--rekor-witness-config")
              checkpoint.add_argument("--receipt-output")
          '''
          if old_parser not in text:
              raise SystemExit("checkpoint parser anchor not found")
          text = text.replace(old_parser, new_parser, 1)

          old_flow = '''        result["rekor_checkpoint_state"]=checkpoint_state
              result["rekor_receipt"]=receipt
              if receipt_output:
          '''
          new_flow = '''        result["rekor_checkpoint_state"]=checkpoint_state
              result["rekor_receipt"]=receipt
              rekor_witness_config=getattr(
                  args,"rekor_witness_config",None
              )
              if rekor_witness_config:
                  current=checkpoint_state["checkpoint"]
                  quorum=collect_rekor_witness_quorum(
                      load_rekor_witness_config(rekor_witness_config),
                      log_id=current["log_id"],
                      origin=current["origin"],
                      tree_size=current["tree_size"],
                      root_hash=current["root_hash"],
                      store=RekorWitnessObservationStore(ledger.backend),
                  )
                  result["rekor_witness_quorum"]=quorum
                  if not quorum["valid"]:
                      raise RuntimeError(
                          "Rekor witness quorum failed: "
                          + str(quorum.get("reason") or "invalid quorum")
                      )
              if receipt_output:
          '''
          if old_flow not in text:
              raise SystemExit("Rekor publication flow anchor not found")
          text = text.replace(old_flow, new_flow, 1)

          old_tail = '''    elif receipt_output:
              raise RuntimeError(
                  "--receipt-output requires --rekor-url"
              )
              rendered=json.dumps(result,indent=2,ensure_ascii=False)
          '''
          new_tail = '''    elif receipt_output:
              raise RuntimeError(
                  "--receipt-output requires --rekor-url"
              )
              elif getattr(args,"rekor_witness_config",None):
              raise RuntimeError(
                  "--rekor-witness-config requires --rekor-url"
              )
              rendered=json.dumps(result,indent=2,ensure_ascii=False)
          '''
          if old_tail not in text:
              raise SystemExit("Rekor publication tail anchor not found")
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text)
          PY
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Targeted tests
        run: |
          pytest -q \
            tests/test_rekor_witness_quorum.py \
            tests/test_rekor_witness_quorum_cli.py \
            tests/test_rekor_checkpoint_state_cli.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/production_os/cli.py
          git commit -m "feat(transparency): enforce optional Rekor witness quorum"
          git push origin HEAD:feat/witness-quorum
