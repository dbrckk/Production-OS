name: Apply P17 witness quorum CLI integration

on:
  push:
    branches: [feat/witness-quorum]
    paths:
      - .github/workflows/apply-p17-witness-quorum-cli.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/witness-quorum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch CLI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/production_os/cli.py")
          text = path.read_text()

          state_import = "    RekorV1ConsistencyClient,\n)\n"
          state_replacement = (
              "    RekorV1ConsistencyClient,\n"
              "    parse_checkpoint_identity,\n"
              ")\n"
          )
          if "    parse_checkpoint_identity,\n" not in text:
              if state_import not in text:
                  raise SystemExit("checkpoint-state import anchor not found")
              text = text.replace(state_import, state_replacement, 1)

          asymmetric_anchor = "from .asymmetric_attestations import (\n"
          quorum_import = (
              "from .rekor_witness_quorum import (\n"
              "    RekorWitnessObservationStore,\n"
              "    collect_rekor_witness_quorum,\n"
              "    load_rekor_witness_config,\n"
              ")\n"
          )
          if "from .rekor_witness_quorum import (\n" not in text:
              if asymmetric_anchor not in text:
                  raise SystemExit("asymmetric import anchor not found")
              text = text.replace(
                  asymmetric_anchor,
                  quorum_import + asymmetric_anchor,
                  1,
              )

          parser_anchor = '    checkpoint.add_argument("--rekor-log-public-key")\n'
          parser_line = '    checkpoint.add_argument("--rekor-witness-config")\n'
          if parser_line not in text:
              if parser_anchor not in text:
                  raise SystemExit("checkpoint parser anchor not found")
              text = text.replace(
                  parser_anchor,
                  parser_anchor + parser_line,
                  1,
              )

          receipt_anchor = '    receipt_output=getattr(args,"receipt_output",None)\n'
          guard = (
              '    rekor_witness_config=getattr(args,"rekor_witness_config",None)\n'
              '    if rekor_witness_config and not rekor_url:\n'
              '        raise RuntimeError(\n'
              '            "--rekor-witness-config requires --rekor-url"\n'
              '        )\n'
          )
          if '    rekor_witness_config=getattr(args,"rekor_witness_config",None)\n' not in text:
              if receipt_anchor not in text:
                  raise SystemExit("receipt config anchor not found")
              text = text.replace(
                  receipt_anchor,
                  receipt_anchor + guard,
                  1,
              )

          publish_anchor = '        receipt=publisher.publish(envelope)\n'
          quorum_flow = (
              '        if rekor_witness_config:\n'
              '            proof=receipt.get("inclusion_proof")\n'
              '            if not isinstance(proof,dict):\n'
              '                raise RuntimeError("Rekor inclusion proof is required")\n'
              '            identity=parse_checkpoint_identity(\n'
              '                str(proof.get("checkpoint") or "")\n'
              '            )\n'
              '            quorum=collect_rekor_witness_quorum(\n'
              '                load_rekor_witness_config(rekor_witness_config),\n'
              '                log_id=str(receipt.get("log_id") or ""),\n'
              '                origin=identity["origin"],\n'
              '                tree_size=int(proof["treeSize"]),\n'
              '                root_hash=str(proof["rootHash"]),\n'
              '                store=RekorWitnessObservationStore(ledger.backend),\n'
              '            )\n'
              '            result["rekor_witness_quorum"]=quorum\n'
              '            if not quorum["valid"]:\n'
              '                raise RuntimeError(\n'
              '                    "Rekor witness quorum failed: "\n'
              '                    + str(quorum.get("reason") or "invalid quorum")\n'
              '                )\n'
          )
          if '            quorum=collect_rekor_witness_quorum(\n' not in text:
              if publish_anchor not in text:
                  raise SystemExit("Rekor publish anchor not found")
              text = text.replace(
                  publish_anchor,
                  publish_anchor + quorum_flow,
                  1,
              )

          path.write_text(text)
          PY
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Targeted tests
        run: |
          pytest -q \
            tests/test_rekor_witness_quorum.py \
            tests/test_rekor_witness_quorum_cli.py \
            tests/test_rekor_checkpoint_state_cli.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/production_os/cli.py
          git commit -m "feat(transparency): enforce optional Rekor witness quorum"
          git push origin HEAD:feat/witness-quorum
