name: P17 enforce signed checkpoint

on:
  push:
    branches:
      - feat/rekor-signed-checkpoint-verification
    paths:
      - .github/workflows/p17-enforce-signed-checkpoint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rekor-signed-checkpoint-verification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python .github/p17_enforce_signed_checkpoint.py
      - name: Verify targeted transparency tests
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          pytest -q tests/test_rekor_signed_checkpoint.py tests/test_rekor_signed_checkpoint_receipt.py tests/test_transparency_receipts.py
      - name: Commit enforcement and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/p17-enforce-signed-checkpoint.yml
          rm .github/p17_enforce_signed_checkpoint.py
          git add src/production_os/transparency_receipts.py tests/test_transparency_receipts.py .github/workflows/p17-enforce-signed-checkpoint.yml .github/p17_enforce_signed_checkpoint.py
          git commit -m "feat(transparency): require signed Rekor tree checkpoints"
          git push
