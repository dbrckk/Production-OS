services:
  production-os:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./artifacts:/data
    command:
      - control-plane
      - --database
      - /data/production.db
      - --auth-config
      - /data/auth.json
      - --host
      - 0.0.0.0
      - --port
      - "8787"
