services:
  production-os:
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  production-worker:
    profiles:
      - worker
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      production-os:
        condition: service_healthy
    environment:
      PRODUCTION_OS_WORKER_TOKEN: ${PRODUCTION_OS_WORKER_TOKEN:-}
      PRODUCTION_OS_RUNTIME_DIR: /var/lib/production-os/runtime
      PRODUCTION_OS_REPOSITORY_CACHE_DIR: /var/lib/production-os/repositories
      PRODUCTION_OS_WORKTREE_DIR: /var/lib/production-os/worktrees
    volumes:
      - ${PRODUCTION_OS_WORKER_EXECUTOR_DIR:-./worker}:/worker:ro
      - production-worker-runtime:/var/lib/production-os/runtime
      - production-worker-repositories:/var/lib/production-os/repositories
      - production-worker-worktrees:/var/lib/production-os/worktrees
    command:
      - remote-worker-run
      - --url
      - http://production-os:8787
      - --worker-id
      - ${PRODUCTION_OS_WORKER_ID:-worker-one}
      - --executor-command
      - ${PRODUCTION_OS_WORKER_EXECUTOR_COMMAND:-}
      - --max-concurrency
      - ${PRODUCTION_OS_WORKER_MAX_CONCURRENCY:-1}
      - --heartbeat-interval-seconds
      - ${PRODUCTION_OS_WORKER_HEARTBEAT_SECONDS:-5}
      - --executor-timeout-seconds
      - ${PRODUCTION_OS_WORKER_EXECUTOR_TIMEOUT_SECONDS:-3600}
      - --ack-timeout-seconds
      - ${PRODUCTION_OS_WORKER_ACK_TIMEOUT_SECONDS:-120}

  production-worker-code:
    profiles:
      - worker-specialists
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      production-os:
        condition: service_healthy
    environment:
      PRODUCTION_OS_WORKER_TOKEN: ${PRODUCTION_OS_WORKER_TOKEN:-}
      PRODUCTION_OS_RUNTIME_DIR: /var/lib/production-os/runtime
      PRODUCTION_OS_REPOSITORY_CACHE_DIR: /var/lib/production-os/repositories
      PRODUCTION_OS_WORKTREE_DIR: /var/lib/production-os/worktrees
      PRODUCTION_OS_WORKER_SPECIALTIES: code
    volumes:
      - ${PRODUCTION_OS_WORKER_EXECUTOR_DIR:-./worker}:/worker:ro
      - production-worker-runtime:/var/lib/production-os/runtime
      - production-worker-repositories:/var/lib/production-os/repositories
      - production-worker-worktrees:/var/lib/production-os/worktrees
    command:
      - remote-worker-run
      - --url
      - http://production-os:8787
      - --worker-id
      - worker-code
      - --capability
      - code-implementation
      - --executor-command
      - ${PRODUCTION_OS_WORKER_EXECUTOR_COMMAND:-}
      - --max-concurrency
      - ${PRODUCTION_OS_SPECIALIST_MAX_CONCURRENCY:-1}
      - --heartbeat-interval-seconds
      - ${PRODUCTION_OS_WORKER_HEARTBEAT_SECONDS:-5}
      - --executor-timeout-seconds
      - ${PRODUCTION_OS_WORKER_EXECUTOR_TIMEOUT_SECONDS:-3600}
      - --ack-timeout-seconds
      - ${PRODUCTION_OS_WORKER_ACK_TIMEOUT_SECONDS:-120}

  production-worker-debug:
    profiles:
      - worker-specialists
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      production-os:
        condition: service_healthy
    environment:
      PRODUCTION_OS_WORKER_TOKEN: ${PRODUCTION_OS_WORKER_TOKEN:-}
      PRODUCTION_OS_RUNTIME_DIR: /var/lib/production-os/runtime
      PRODUCTION_OS_REPOSITORY_CACHE_DIR: /var/lib/production-os/repositories
      PRODUCTION_OS_WORKTREE_DIR: /var/lib/production-os/worktrees
      PRODUCTION_OS_WORKER_SPECIALTIES: debug
    volumes:
      - ${PRODUCTION_OS_WORKER_EXECUTOR_DIR:-./worker}:/worker:ro
      - production-worker-runtime:/var/lib/production-os/runtime
      - production-worker-repositories:/var/lib/production-os/repositories
      - production-worker-worktrees:/var/lib/production-os/worktrees
    command:
      - remote-worker-run
      - --url
      - http://production-os:8787
      - --worker-id
      - worker-debug
      - --capability
      - test-debug
      - --executor-command
      - ${PRODUCTION_OS_WORKER_EXECUTOR_COMMAND:-}
      - --max-concurrency
      - ${PRODUCTION_OS_SPECIALIST_MAX_CONCURRENCY:-1}
      - --heartbeat-interval-seconds
      - ${PRODUCTION_OS_WORKER_HEARTBEAT_SECONDS:-5}
      - --executor-timeout-seconds
      - ${PRODUCTION_OS_WORKER_EXECUTOR_TIMEOUT_SECONDS:-3600}
      - --ack-timeout-seconds
      - ${PRODUCTION_OS_WORKER_ACK_TIMEOUT_SECONDS:-120}

  production-worker-review:
    profiles:
      - worker-specialists
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      production-os:
        condition: service_healthy
    environment:
      PRODUCTION_OS_WORKER_TOKEN: ${PRODUCTION_OS_WORKER_TOKEN:-}
      PRODUCTION_OS_RUNTIME_DIR: /var/lib/production-os/runtime
      PRODUCTION_OS_REPOSITORY_CACHE_DIR: /var/lib/production-os/repositories
      PRODUCTION_OS_WORKTREE_DIR: /var/lib/production-os/worktrees
      PRODUCTION_OS_WORKER_SPECIALTIES: review
    volumes:
      - ${PRODUCTION_OS_WORKER_EXECUTOR_DIR:-./worker}:/worker:ro
      - production-worker-runtime:/var/lib/production-os/runtime
      - production-worker-repositories:/var/lib/production-os/repositories
      - production-worker-worktrees:/var/lib/production-os/worktrees
    command:
      - remote-worker-run
      - --url
      - http://production-os:8787
      - --worker-id
      - worker-review
      - --capability
      - code-review
      - --executor-command
      - ${PRODUCTION_OS_WORKER_EXECUTOR_COMMAND:-}
      - --max-concurrency
      - ${PRODUCTION_OS_SPECIALIST_MAX_CONCURRENCY:-1}
      - --heartbeat-interval-seconds
      - ${PRODUCTION_OS_WORKER_HEARTBEAT_SECONDS:-5}
      - --executor-timeout-seconds
      - ${PRODUCTION_OS_WORKER_EXECUTOR_TIMEOUT_SECONDS:-3600}
      - --ack-timeout-seconds
      - ${PRODUCTION_OS_WORKER_ACK_TIMEOUT_SECONDS:-120}

  production-worker-browser:
    profiles:
      - worker-specialists
    build:
      context: .
      dockerfile: Dockerfile.browser-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      production-os:
        condition: service_healthy
    environment:
      PRODUCTION_OS_WORKER_TOKEN: ${PRODUCTION_OS_WORKER_TOKEN:-}
      PRODUCTION_OS_RUNTIME_DIR: /var/lib/production-os/runtime
      PRODUCTION_OS_REPOSITORY_CACHE_DIR: /var/lib/production-os/repositories
      PRODUCTION_OS_WORKTREE_DIR: /var/lib/production-os/worktrees
      PRODUCTION_OS_WORKER_SPECIALTIES: browser
    volumes:
      - ${PRODUCTION_OS_WORKER_EXECUTOR_DIR:-./worker}:/worker:ro
      - production-worker-runtime:/var/lib/production-os/runtime
      - production-worker-repositories:/var/lib/production-os/repositories
      - production-worker-worktrees:/var/lib/production-os/worktrees
    command:
      - remote-worker-run
      - --url
      - http://production-os:8787
      - --worker-id
      - worker-browser
      - --capability
      - browser-ui-validation
      - --executor-command
      - ${PRODUCTION_OS_WORKER_EXECUTOR_COMMAND:-}
      - --max-concurrency
      - ${PRODUCTION_OS_SPECIALIST_MAX_CONCURRENCY:-1}
      - --heartbeat-interval-seconds
      - ${PRODUCTION_OS_WORKER_HEARTBEAT_SECONDS:-5}
      - --executor-timeout-seconds
      - ${PRODUCTION_OS_WORKER_EXECUTOR_TIMEOUT_SECONDS:-3600}
      - --ack-timeout-seconds
      - ${PRODUCTION_OS_WORKER_ACK_TIMEOUT_SECONDS:-120}

  production-worker-mobile:
    profiles:
      - worker-specialists
    build:
      context: .
      dockerfile: Dockerfile.mobile-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    shm_size: 2gb
    devices:
      - /dev/kvm:/dev/kvm
    depends_on:
      production-os:
        condition: service_healthy
    environment:
      PRODUCTION_OS_WORKER_TOKEN: ${PRODUCTION_OS_WORKER_TOKEN:-}
      PRODUCTION_OS_RUNTIME_DIR: /var/lib/production-os/runtime
      PRODUCTION_OS_REPOSITORY_CACHE_DIR: /var/lib/production-os/repositories
      PRODUCTION_OS_WORKTREE_DIR: /var/lib/production-os/worktrees
      PRODUCTION_OS_WORKER_SPECIALTIES: mobile
      PRODUCTION_OS_ANDROID_AVD: ${PRODUCTION_OS_ANDROID_AVD:-production-os-api35}
      ANDROID_AVD_HOME: /opt/android-avd
    volumes:
      - ${PRODUCTION_OS_WORKER_EXECUTOR_DIR:-./worker}:/worker:ro
      - production-worker-runtime:/var/lib/production-os/runtime
      - production-worker-repositories:/var/lib/production-os/repositories
      - production-worker-worktrees:/var/lib/production-os/worktrees
    command:
      - remote-worker-run
      - --url
      - http://production-os:8787
      - --worker-id
      - worker-mobile
      - --capability
      - mobile-ui-validation
      - --executor-command
      - ${PRODUCTION_OS_WORKER_EXECUTOR_COMMAND:-}
      - --max-concurrency
      - ${PRODUCTION_OS_SPECIALIST_MAX_CONCURRENCY:-1}
      - --heartbeat-interval-seconds
      - ${PRODUCTION_OS_WORKER_HEARTBEAT_SECONDS:-5}
      - --executor-timeout-seconds
      - ${PRODUCTION_OS_MOBILE_WORKER_TIMEOUT_SECONDS:-5400}
      - --ack-timeout-seconds
      - ${PRODUCTION_OS_WORKER_ACK_TIMEOUT_SECONDS:-120}


volumes:
  production-worker-runtime:
  production-worker-repositories:
  production-worker-worktrees:
